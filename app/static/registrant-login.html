<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RegFire · Attendee dashboard</title><link rel="stylesheet" href="/access.css"><script src="/registrant-login.js" defer></script></head><body><main class="access-card"><img src="/regfire-logo.png" alt="RegFire" width="140"><h1>Attendee dashboard</h1><p>Sign in to see your completed registrations. This account is separate from organizer and client access.</p><p id="returning-status" role="status"></p><form id="attendee-login"><label>Email<input name="email" type="email" required autocomplete="username" maxlength="254"></label><label>Password<input id="attendee-password" name="password" type="password" required autocomplete="current-password" maxlength="256"></label><button type="button" id="password-visibility" class="secondary" aria-pressed="false">Show password</button><button type="submit">Sign in</button></form><button id="attendee-logout" class="secondary" hidden>Sign out</button><div id="attendee-registrations"></div><p id="recovery-note">If you cannot sign in, contact your event organizer. Automatic attendee password recovery is not configured.</p><a id="returning-event" hidden>Back to event welcome page</a></main></body></html>
