<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RegFire · Attendee dashboard</title><link rel="stylesheet" href="/access.css"><script src="/registrant-login.js" defer></script><style>.access-card{max-width:1050px!important;width:calc(100% - 40px);box-sizing:border-box}#attendee-login{max-width:460px}#attendee-registrations{display:grid;gap:22px}.panel{padding:24px;background:#fff;border:1px solid #e1e1e6;border-radius:14px;color:#24242b;overflow-wrap:anywhere}.dashboard-details{display:grid;grid-template-columns:minmax(100px,1fr) 2fr;gap:8px;margin:20px 0}.dashboard-details dd{margin:0}.dashboard-details dt{font-weight:600}.dashboard-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.dashboard-actions a,.dashboard-actions button{padding:12px 16px;background:#a6411e;color:white;border-radius:7px;text-decoration:none;font-size:14px;display:inline-block}.dashboard-editor{border-top:1px solid #ddd;margin-top:22px;padding-top:16px}.dashboard-editor button{margin:12px 10px 0 0}@media(max-width:560px){.access-card{width:100%;padding:20px!important}.panel{padding:16px}.dashboard-actions>*{width:100%;box-sizing:border-box;text-align:center}}</style></head><body><main class="access-card"><img src="/regfire-logo.png" alt="RegFire" width="140"><h1>Attendee dashboard</h1><p>Sign in to see your completed registrations. This account is separate from organizer and client access.</p><p id="returning-status" role="status"></p><form id="attendee-login"><label>Email<input name="email" type="email" required autocomplete="username" maxlength="254"></label><label>Password<input id="attendee-password" name="password" type="password" required autocomplete="current-password" maxlength="256"></label><button type="button" id="password-visibility" class="secondary" aria-pressed="false">Show password</button><button type="submit">Sign in</button></form><button id="attendee-logout" class="secondary" hidden>Sign out</button><div id="attendee-registrations"></div><p id="recovery-note">If you cannot sign in, contact your event organizer. Automatic attendee password recovery is not configured.</p><a id="returning-event" hidden>Back to registration</a></main></body></html>
